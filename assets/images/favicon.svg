<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="fav-orange-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B20" />
      <stop offset="100%" stop-color="#FFC400" />
    </linearGradient>
    <linearGradient id="fav-silver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#C5C5C5" />
      <stop offset="100%" stop-color="#7B7B80" />
    </linearGradient>
    <linearGradient id="fav-silver-dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E5E5E5" />
      <stop offset="100%" stop-color="#808085" />
    </linearGradient>
  </defs>

  <!-- Deep Black Background -->
  <rect x="0" y="0" width="120" height="120" rx="24" fill="#0A0A0A" stroke="#222222" stroke-width="2" />

  <!-- Silver Skyscraper Graphics -->
  <!-- Left Tower -->
  <rect x="28" y="52" width="14" height="48" fill="url(#fav-silver-dark)" rx="2" />
  <line x1="33" y1="56" x2="33" y2="94" stroke="#0A0A0A" stroke-width="1.5" stroke-dasharray="2,3" />
  <line x1="37" y1="56" x2="37" y2="94" stroke="#0A0A0A" stroke-width="1.5" stroke-dasharray="2,3" />

  <!-- Center Spire Tower -->
  <polygon points="52,32 68,32 68,100 52,100" fill="url(#fav-silver)" />
  <line x1="60" y1="20" x2="60" y2="32" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" />
  <line x1="56" y1="36" x2="56" y2="96" stroke="#0A0A0A" stroke-width="1.5" stroke-dasharray="2,2" />
  <line x1="60" y1="36" x2="60" y2="96" stroke="#0A0A0A" stroke-width="1.5" stroke-dasharray="2,2" />
  <line x1="64" y1="36" x2="64" y2="96" stroke="#0A0A0A" stroke-width="1.5" stroke-dasharray="2,2" />

  <!-- Right Tower -->
  <polygon points="76,46 90,52 90,100 76,100" fill="url(#fav-silver-dark)" />
  <line x1="81" y1="54" x2="81" y2="94" stroke="#0A0A0A" stroke-width="1.5" stroke-dasharray="2,3" />
  <line x1="85" y1="56" x2="85" y2="94" stroke="#0A0A0A" stroke-width="1.5" stroke-dasharray="2,3" />

  <!-- Orange & Golden-Yellow House-Shaped Architectural Roof -->
  <path d="M22 62 L60 28 L98 62" fill="none" stroke="url(#fav-orange-gold)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M34 60 L60 38 L86 60" fill="none" stroke="#FFC400" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Foundation Beam -->
  <line x1="20" y1="102" x2="100" y2="102" stroke="url(#fav-orange-gold)" stroke-width="4" stroke-linecap="round" />
</svg>

